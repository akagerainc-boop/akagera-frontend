# Render Blueprint for the static frontend.
# If your Render static site was created from the dashboard (not a blueprint),
# this file is ignored — instead add a rule under
#   Settings -> Redirect and Rewrite Rules:
#     Source: /privacy-policy   Destination: /privacy-policy.html   Action: Rewrite
#     Source: /*   Destination: /index.html   Action: Rewrite  (keep this one last)
services:
  - type: web
    name: akagera-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_FIREBASE_API_KEY
        sync: false
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: REACT_APP_FIREBASE_PROJECT_ID
        sync: false
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: REACT_APP_FIREBASE_APP_ID
        sync: false
    routes:
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy.html
      - type: rewrite
        source: /*
        destination: /index.html
